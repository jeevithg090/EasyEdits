# Lint configuration for the Python helper scripts in server/ and colab/.
target-version = "py310"
line-length = 120
extend-exclude = ["server/autocrop-vertical", "server/autocrop-content", "server/venv", "*.ipynb"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# These files are snippets pasted into the Colab notebook and rely on its globals.
"colab/*.py" = ["F821"]
